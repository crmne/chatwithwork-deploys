# Carmine's approval of one Chat with Work deploy (crmne/chatwithwork,
# docs/security/deploy-approval.md). The deploy's pre-deploy hook dispatches
# this with the exact commit and image digest about to go live. The job waits
# in the `production` environment until Carmine, its required reviewer,
# approves it in GitHub (the phone app notifies him); only then does it get
# the environment's signing key, sign that request, and hand the signature
# back as an artifact. The hook checks the signature against the public key
# committed in crmne/chatwithwork and refuses the deploy without it.
#
# A deploy from GitHub Actions (crmne/chatwithwork's deploy.yml) also sends
# the public half of an SSH key it made for this one deploy. After the
# approval, and only then, the job certifies that key with the environment's
# SSH certificate authority, for two hours, as the `chatwithwork-deploy`
# principal the production host lets in as root. The certificate is public
# (it is useless without the key, which never leaves the deploy's job), so it
# goes back in the same artifact. A deploy from Carmine's machine sends no
# key and gets no certificate.
#
# The master copy of this file is script/deploy_approvals/approve.yml in
# crmne/chatwithwork, whose bin/deploy-approval pins its git blob.
#
# `dry-run` is the same flow with no reviewer and a key of its own that
# production never trusts, for testing the plumbing.
name: Approve a deploy
run-name: "${{ inputs.environment }}: ${{ inputs.sha }} (${{ inputs.nonce }})"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: production, or dry-run to test
        type: choice
        options: [production, dry-run]
        required: true
      sha:
        description: The crmne/chatwithwork commit being deployed
        type: string
        required: true
      digest:
        description: The image digest the hosts pulled (sha256:...)
        type: string
        required: true
      command:
        description: The Kamal command (deploy, redeploy, rollback, setup)
        type: string
        required: true
      nonce:
        description: A random value naming this request
        type: string
        required: true
      ssh_key:
        description: The deploy's own SSH public key (ssh-ed25519 ...) to certify, or empty
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: approve-${{ inputs.nonce }}
  cancel-in-progress: false

jobs:
  approve:
    name: Approve
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      # Inputs reach the shell only through the environment, never pasted
      # into the script, and must have exactly the expected shape.
      - name: Check the request
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
          DIGEST: ${{ inputs.digest }}
          COMMAND: ${{ inputs.command }}
          NONCE: ${{ inputs.nonce }}
          SSH_KEY: ${{ inputs.ssh_key }}
        run: |
          set -euo pipefail
          [[ "$ENVIRONMENT" =~ ^(production|dry-run)$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$COMMAND" =~ ^(deploy|redeploy|rollback|setup)$ ]]
          [[ "$NONCE" =~ ^[0-9a-f]{32}$ ]]
          [[ -z "$SSH_KEY" || "$SSH_KEY" =~ ^ssh-ed25519\ AAAAC3NzaC1lZDI1NTE5AAAAI[A-Za-z0-9+/]{43}$ ]]

      - name: Sign the approval
        env:
          KEY: ${{ secrets.DEPLOY_APPROVAL_KEY }}
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
          DIGEST: ${{ inputs.digest }}
          COMMAND: ${{ inputs.command }}
          NONCE: ${{ inputs.nonce }}
          SSH_KEY: ${{ inputs.ssh_key }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p approval
          key="$RUNNER_TEMP/approval_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEY" > "$key"
          jq -cn \
            --arg repository crmne/chatwithwork --arg environment "$ENVIRONMENT" \
            --arg sha "$SHA" --arg digest "$DIGEST" --arg command "$COMMAND" --arg nonce "$NONCE" \
            --arg ssh_key "$SSH_KEY" --arg run_id "$GITHUB_RUN_ID" --arg approved_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repository: $repository, environment: $environment, sha: $sha, digest: $digest, command: $command, nonce: $nonce, ssh_key: $ssh_key, run_id: $run_id, approved_at: $approved_at}' \
            > approval/approval.json
          ssh-keygen -q -Y sign -n "chatwithwork-deploy-$ENVIRONMENT" -f "$key" approval/approval.json
          cat approval/approval.json

      # Only for a request that sent a key: a certificate for exactly that
      # key, valid from five minutes ago (clock skew) for two hours, named
      # after this run and the commit so the host's sshd log says which
      # approval let each login in. No agent or X11 forwarding.
      - name: Certify the deploy's SSH key
        if: inputs.ssh_key != ''
        env:
          CA: ${{ secrets.DEPLOY_SSH_CA_KEY }}
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
          SSH_KEY: ${{ inputs.ssh_key }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$CA" ] || { echo "The $ENVIRONMENT environment has no DEPLOY_SSH_CA_KEY."; exit 1; }
          ca="$RUNNER_TEMP/ssh_ca"
          trap 'rm -f "$ca"' EXIT
          printf '%s\n' "$CA" > "$ca"
          printf '%s\n' "$SSH_KEY" > approval/deploy_key.pub
          ssh-keygen -q -s "$ca" -I "chatwithwork-deploy-$ENVIRONMENT-$GITHUB_RUN_ID-${SHA:0:12}" \
            -n chatwithwork-deploy -V -5m:+2h -O no-agent-forwarding -O no-x11-forwarding approval/deploy_key.pub
          ssh-keygen -L -f approval/deploy_key-cert.pub

      - name: Hand the signed approval back
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approval
          path: approval/
          retention-days: 7
          if-no-files-found: error
